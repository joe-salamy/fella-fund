# Copy to ~/.config/fella-fund/secrets.toml (chmod 600). Never commit the real one.

[smtp]
user = "you@gmail.com"
# Gmail app password (needs 2-Step Verification): https://myaccount.google.com/apppasswords
app_password = ""
# host = "smtp.gmail.com"
# port = 465

[email]
from_name = "The Fella Fund Managers"
# Who gets a failure alert if a scheduled run breaks (defaults to smtp.user).
alert_to = "you@gmail.com"
# Public site link added to the bottom of the newsletter.
site_url = ""
# Optional image at the bottom of the newsletter (the old Drive image).
# newsletter_image = "~/Code/fella-fund/assets/newsletter_image.png"
recipients = [
  "friend@example.com",
]
